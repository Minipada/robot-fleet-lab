# The distribution of the Robot Fleet Lab: poky, renamed. TARGET_VENDOR and
# the other settings that feed the toolchain triplet stay as poky has them,
# so the build cache from poky stays valid.
require conf/distro/poky.conf

DISTRO = "fleet-lab"
DISTRO_NAME = "Robot Fleet Lab"
DISTRO_VERSION = "0.1"
MAINTAINER = "David Bensoussan"

# What the machine calls itself at the login prompt and in /etc/hostname.
hostname:pn-base-files = "robot"
