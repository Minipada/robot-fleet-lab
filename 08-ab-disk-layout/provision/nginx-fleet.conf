# HTTP for the installer: the boot script, the installer kernel and
# initramfs, and the robot image. Installed by edge.sh.
server {
    listen 8080;
    root /srv/fleet-www;

    # The script is ours; it lives in /srv/fleet-www.
    location = /boot.ipxe { }

    # Everything else is the Yocto build output.
    location / {
        root /srv/images;
    }
}
